<style>
/* Minimal fallback so the page is readable when css/style.css is missing.
   css/style.css (linked below) uses the same token names and wins when present. */
:root{
  --bg:#0f1319; --panel:#161c25; --panel2:#1c2430; --line:#263040; --fg:#e6ebf2; --muted:#8a97a8;
  --accent:#4f8cff; --up:#22c55e; --down:#ef4444; --warn:#f5b84d;
  --font:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --line:#d6dce5; --fg:#141a22; --muted:#5f6b7a; --accent:#2563eb; --up:#16a34a; --down:#dc2626; --warn:#b7791f; color-scheme:light } }
:root[data-theme="light"]{ --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --line:#d6dce5; --fg:#141a22; --muted:#5f6b7a; --accent:#2563eb; --up:#16a34a; --down:#dc2626; --warn:#b7791f; color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;
  padding-block:0 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)} button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)} button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:inherit;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:500}
.pill{font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.demo{color:var(--warn);border-color:var(--warn)} .pill.live{color:var(--up);border-color:var(--up)}
footer.disclaimer{color:var(--muted);font-size:11px;padding-block:14px 0;text-align:center;border-top:1px solid var(--line);margin-top:20px}
</style>

<style>

}

.drill .dattempts{font-size:12px;color:var(--muted);font-family:var(--mono)}

/* ---- v0.3: certificate id ---- */
.certid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13px}
.certid .k{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.certid .v{font-weight:500;word-break:break-all}
.certid .certlinks{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:760px){.certid{grid-template-columns:1fr}}
.filebtn{display:inline-block;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer}

/* ---- phone polish: tap targets, stacked lesson nav, bottom tab bar room ---- */
@media (max-width:760px){
  .blocks{max-width:none}
  .lesson-nav{max-width:none;flex-direction:column;align-items:stretch}
  .lesson-nav > span{display:flex} .lesson-nav > span > a{flex:1;display:flex} .lesson-nav > span > a > button{flex:1;min-height:44px}
  .lesson-nav #doneArea{flex-direction:column;align-items:stretch;text-align:center}
  .navt{display:inline-block;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .quiz .choice{min-height:44px;align-items:center}
  .sidebar .back,.sidebar summary{min-height:44px}
  .exercise .go{display:inline-flex;align-items:center;min-height:44px}
  .filebtn{min-height:44px;display:inline-flex;align-items:center}
  .toolbtn{min-height:44px}
  .cert-form input,.cert-form button{min-height:44px}
  .checklist li{grid-template-columns:18px 1fr;row-gap:2px}
  .checklist li > span:last-child{grid-column:2}
  body.has-tabbar .learn-wrap{padding-bottom:12px}
}
@media print{.topnav,.tabbar,.sidebar,.lesson-nav,.cert-form,.teaser,.procard,.gl-pop,#nav,#footer{display:none !important}}
