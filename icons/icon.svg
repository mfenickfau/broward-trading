<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Broward Trading">
  <title>Broward Trading</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c25"/>
      <stop offset="1" stop-color="#0f1319"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <!-- tile (full bleed so the maskable crop has no transparent corners) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#263040" stroke-width="4"/>
  <!-- faint grid, like the chart panes -->
  <g stroke="#263040" stroke-width="3" opacity=".7">
    <path d="M96 192h320M96 272h320M96 352h320"/>
  </g>
  <!-- area under the trend line -->
  <path d="M112 352 L184 300 L256 318 L328 232 L400 176 L400 392 L112 392 Z" fill="url(#glow)"/>
  <!-- candles: green up, red down, green up (the course's colour rule) -->
  <g stroke-width="8" stroke-linecap="round">
    <path d="M160 236v96" stroke="#22c55e"/>
    <rect x="140" y="256" width="40" height="56" rx="6" fill="#22c55e"/>
    <path d="M256 268v80" stroke="#ef4444"/>
    <rect x="236" y="284" width="40" height="44" rx="6" fill="#ef4444"/>
    <path d="M352 168v108" stroke="#22c55e"/>
    <rect x="332" y="186" width="40" height="72" rx="6" fill="#22c55e"/>
  </g>
  <!-- rising trend line in the brand accent -->
  <path d="M112 352 L184 300 L256 318 L328 232 L400 176" fill="none" stroke="#4f8cff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="176" r="18" fill="#4f8cff"/>
  <circle cx="400" cy="176" r="8" fill="#ffffff"/>
</svg>
