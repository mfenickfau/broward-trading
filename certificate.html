<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Printable Broward Trading certificate of completion: name, course, date, certificate id and verification link on one landscape sheet. Save it as a PDF from your browser's print dialog.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1319">
<meta name="robots" content="noindex">
<title>Certificate · Broward Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
/* page-local layout only; colours and fonts come from css/style.css tokens */
.cert-wrap{max-width:1100px;margin:0 auto}
.cert-lede{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;padding:18px 0 10px}
.cert-lede h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.2px}
.cert-lede p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.cert-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.cert-tools .btn,.cert-tools button{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.cert-tools .spacer{flex:1}
.cert-tools .lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cert-tools .lang button{border:0;border-radius:0;min-width:48px;background:var(--panel2)}
.cert-tools .lang button.on{background:var(--accent);color:#fff}
.cert-help{color:var(--muted);font-size:12px;margin:10px 0 0;line-height:1.55}
.cert-help code{font-size:11px}

/* the sheet: a fixed-aspect landscape page on wide screens and in print, a readable column on phones */
.sheet-host{container-type:inline-size;width:100%}
.cert-sheet{position:relative;width:100%;aspect-ratio:1.38;background:#ffffff;color:#141a22;border:1px solid var(--line);border-radius:6px;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.25);font-family:var(--font);display:flex;flex-direction:column;justify-content:space-between;
  padding:6cqw 7cqw 4.2cqw;font-size:1.35cqw;line-height:1.4}
.cert-sheet::before{content:"";position:absolute;inset:1.6cqw;border:.18cqw solid #2563eb;border-radius:.8cqw;pointer-events:none}
.cert-sheet::after{content:"";position:absolute;inset:2.3cqw;border:.06cqw solid #d6dce5;border-radius:.6cqw;pointer-events:none}
.cert-sheet .candles{position:absolute;left:8cqw;right:8cqw;bottom:13.5cqw;height:9cqw;opacity:.35;pointer-events:none}
.cert-sheet .candles svg{width:100%;height:100%;display:block}
.cert-sheet .brand{display:flex;align-items:center;justify-content:center;gap:1.2cqw;text-align:left}
.cert-sheet .brand .mark{width:4.6cqw;height:4.6cqw;flex:none}
.cert-sheet .brand b{display:block;font-size:2.4cqw;font-weight:600;line-height:1.1}
.cert-sheet .brand small{display:block;color:#5f6b7a;font-size:1.15cqw;margin-top:.3cqw}
.cert-sheet .title{text-align:center;color:#2563eb;letter-spacing:.42cqw;text-transform:uppercase;font-size:1.5cqw;font-weight:500;margin:3.2cqw 0 2.6cqw}
.cert-sheet .certifies{text-align:center;color:#5f6b7a;font-size:1.5cqw;margin:0}
.cert-sheet .name{text-align:center;font-size:5.2cqw;font-weight:600;letter-spacing:-.05cqw;line-height:1.15;margin:1.4cqw 0 .8cqw;padding:0 2cqw;overflow-wrap:anywhere}
.cert-sheet .name.long{font-size:4cqw} .cert-sheet .name.longer{font-size:3.1cqw}
.cert-sheet .rule{width:56%;margin:0 auto 1.8cqw;border-top:.08cqw solid #d6dce5}
.cert-sheet .has{text-align:center;color:#5f6b7a;font-size:1.5cqw;margin:0}
.cert-sheet .course{text-align:center;font-size:2.5cqw;font-weight:600;margin:.8cqw 0 .9cqw;line-height:1.2}
.cert-sheet .modules{text-align:center;color:#5f6b7a;font-size:1.15cqw;line-height:1.55;margin:0 auto;max-width:86%}
.cert-sheet .foot{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:2cqw;align-items:end;margin-top:3cqw}
.cert-sheet .foot .k{display:block;color:#5f6b7a;font-size:1.05cqw;margin-top:.3cqw}
.cert-sheet .foot .v{font-size:1.5cqw;font-weight:500}
.cert-sheet .foot .sig{border-top:.08cqw solid #141a22;padding-top:.5cqw;min-width:18cqw;display:inline-block}
.cert-sheet .foot .sig .v{font-family:var(--font)}
.cert-sheet .foot .id .v{font-family:var(--mono);letter-spacing:.08cqw}
.cert-sheet .foot .id{text-align:right}
.cert-sheet .foot .verify{display:block;font-family:var(--mono);font-size:.95cqw;color:#5f6b7a;margin-top:.4cqw;overflow-wrap:anywhere}
.cert-sheet .seal{width:7.4cqw;height:7.4cqw;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 .5cqw #2563eb,inset 0 0 0 .62cqw rgba(255,255,255,.7);line-height:1.1;justify-self:center}
.cert-sheet .seal b{display:block;font-size:1.9cqw;font-weight:600}
.cert-sheet .seal small{display:block;font-size:.8cqw;letter-spacing:.1cqw;margin-top:.2cqw}
.cert-sheet .disclaimer{text-align:center;color:#5f6b7a;font-size:.95cqw;margin:2cqw 0 0;line-height:1.45}
.cert-sheet .status{display:inline-block;font-size:.9cqw;letter-spacing:.1cqw;text-transform:uppercase;border:.06cqw solid #d6dce5;border-radius:999px;padding:.15cqw .7cqw;color:#5f6b7a;margin-left:.5cqw;vertical-align:middle}
.cert-sheet .status.verified{color:#16a34a;border-color:#16a34a}
.cert-sheet.preview .name::after{content:" ";}
.cert-sheet .watermark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#dc2626;opacity:.14;font-size:14cqw;font-weight:600;transform:rotate(-20deg);letter-spacing:.5cqw}

/* phones: let the sheet flow at normal sizes (the print version keeps its landscape layout) */
@media screen and (max-width:640px){
  .cert-sheet{aspect-ratio:auto;padding:28px 18px 20px;font-size:14px;line-height:1.5;border-radius:8px}
  .cert-sheet::before{inset:8px;border-width:2px;border-radius:6px} .cert-sheet::after{inset:12px;border-width:1px;border-radius:4px}
  .cert-sheet .candles{display:none}
  .cert-sheet .brand .mark{width:34px;height:34px} .cert-sheet .brand b{font-size:19px} .cert-sheet .brand small{font-size:11px}
  .cert-sheet .title{font-size:12px;letter-spacing:3px;margin:20px 0 14px}
  .cert-sheet .certifies,.cert-sheet .has{font-size:14px}
  .cert-sheet .name{font-size:30px;margin:10px 0 6px} .cert-sheet .name.long{font-size:24px} .cert-sheet .name.longer{font-size:20px}
  .cert-sheet .rule{margin-bottom:12px;border-top-width:1px}
  .cert-sheet .course{font-size:19px;margin:6px 0}
  .cert-sheet .modules{font-size:12px;max-width:none}
  .cert-sheet .foot{grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  .cert-sheet .foot .seal{grid-column:1 / -1;width:64px;height:64px;box-shadow:inset 0 0 0 4px #2563eb,inset 0 0 0 5px rgba(255,255,255,.7)}
  .cert-sheet .seal b{font-size:17px} .cert-sheet .seal small{font-size:8px;letter-spacing:1px}
  .cert-sheet .foot .k{font-size:10px} .cert-sheet .foot .v{font-size:14px} .cert-sheet .foot .verify{font-size:10px}
  .cert-sheet .foot .sig{min-width:0;width:100%;border-top-width:1px;padding-top:6px}
  .cert-sheet .status{font-size:9px;padding:1px 6px;border-width:1px}
  .cert-sheet .disclaimer{font-size:10px;margin-top:16px}
  .cert-sheet .watermark{font-size:64px}
}
@media (prefers-color-scheme:dark){ .cert-sheet{box-shadow:0 12px 40px rgba(0,0,0,.5)} }

/* empty state */
.cert-empty{padding:18px}
.cert-empty h2{text-transform:none;letter-spacing:0;font-size:17px;color:var(--fg);margin-bottom:6px}
.cert-empty p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.55}
.cert-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:8px}
.cert-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.cert-form input{min-height:44px;font-size:16px}
.cert-form button{min-height:44px;align-self:end}

/* print: one landscape sheet, nothing else (css/print.css hides the shell) */
@page{size:landscape;margin:10mm}
@media print{
  html,body{background:#fff!important}
  body{padding:0!important;margin:0!important}
  .cert-wrap{max-width:none}
  .sheet-host{width:auto;display:flex;justify-content:center}
  .cert-sheet{width:auto;height:178mm;aspect-ratio:1.38;max-width:100%;box-shadow:none!important;border:0!important;border-radius:0;break-inside:avoid;page-break-inside:avoid;
    /* 1cqw of a 246mm-wide sheet; restated in mm so browsers that ignore container units in print still scale correctly */
    font-size:3.3mm}
  .cert-sheet .candles{opacity:.3}
  .cert-empty{border:0}
}
</style>
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body class="page cert-page">
<div id="nav"></div>
<script src="js/nav.js"></script>

<main class="cert-wrap" id="main">
  <header class="cert-lede">
    <h1 data-t="pageTitle">Your certificate</h1>
    <p data-t="pageLede">One landscape sheet with your name, the course, the date, the certificate id and the link anyone can use to check it. Use your browser’s print dialog and choose “Save as PDF” to keep a copy.</p>
  </header>

  <div class="cert-tools" id="tools">
    <a class="btn" href="learn.html#/certificate" data-t="backLearn">← Back to the course</a>
    <button type="button" class="primary" id="printBtn" data-t="print">Print / Save as PDF</button>
    <a class="btn" id="verifyLink" href="verify.html" target="_blank" rel="noopener" data-t="verify">Verify this id ↗</a>
    <span class="spacer"></span>
    <span class="lang" role="group" aria-label="Certificate language"><button type="button" data-lang="en" class="on">EN</button><button type="button" data-lang="es">ES</button></span>
  </div>

  <div class="sheet-host"><div id="sheet" aria-live="polite"></div></div>

  <p class="cert-help" id="help"></p>
</main>

<div id="footer"></div>

<script src="js/course.js"></script>
<script>
/* Broward Trading — certificate.html page script.
 * Data, in order: ?name=&id=&date= query parameters (so a saved link re-renders the same
 * sheet anywhere) → the bt.course certificate record saved by the issue flow on learn.html
 * (BT.course.certificateRecord). Text is EN/ES: ?lang=, then BT.i18n (js/i18n.js, loaded by
 * nav.js when present), then English. Every optional module is guarded. */
(function () {
  'use strict';
  var BT = window.BT || {};
  var C = BT.course || null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  var STR = {
    en: {
      pageTitle: 'Your certificate',
      pageLede: 'One landscape sheet with your name, the course, the date, the certificate id and the link anyone can use to check it. Use your browser’s print dialog and choose “Save as PDF” to keep a copy.',
      backLearn: '← Back to the course', print: 'Print / Save as PDF', verify: 'Verify this id ↗',
      tagline: 'Paper-trading & technical-analysis lab', title: 'Certificate of Completion', certifies: 'This certifies that',
      has: 'has completed all {n} modules and passed every quiz of', hasNoCount: 'has completed every module and passed every quiz of',
      defaultCourse: 'Broward Trading Course', date: 'Date of completion', id: 'Certificate id', verified: 'verified', selfIssued: 'self-issued',
      signature: 'Course author · Broward Trading', seal: 'LEARN · TRADE', student: 'Student',
      disclaimerVerified: 'Broward Trading is a free educational simulator. This certificate recognises completion of an online course; it is not a professional licence, a qualification or financial advice.',
      disclaimerSelf: 'Broward Trading is a free educational simulator. This self-issued certificate recognises completion of an online course; it is not a professional licence, a qualification or financial advice.',
      helpVerified: 'This id is stored on the Broward Trading server; anyone can check it at {url}.',
      helpSelf: 'This id was issued inside your browser from progress saved on this device; the Verify page recognises it only here. Sign in on the Pro page (when available) and issue again for a server-verified id.',
      helpParams: 'Showing the details from this page’s address. Nothing is checked here: use the Verify page to confirm an id.',
      helpTip: 'Tip: in the print dialog set the destination to “Save as PDF”, landscape orientation and no headers or footers.',
      emptyTitle: 'No certificate on this device yet',
      emptyBody: 'Certificates are issued from the course page once every lesson is done and each module’s quiz average is 80% or better. The issued record is saved in this browser and shows up here automatically.',
      emptyGo: 'See your progress and requirements', or: 'Already have a certificate? Enter its details to print it:',
      fName: 'Name on the certificate', fId: 'Certificate id', fDate: 'Date (YYYY-MM-DD)', fShow: 'Show certificate', preview: 'PREVIEW',
      langAria: 'Certificate language'
    },
    es: {
      pageTitle: 'Tu certificado',
      pageLede: 'Una hoja horizontal con tu nombre, el curso, la fecha, el id del certificado y el enlace con el que cualquiera puede comprobarlo. Usa el diálogo de impresión de tu navegador y elige “Guardar como PDF” para conservar una copia.',
      backLearn: '← Volver al curso', print: 'Imprimir / Guardar como PDF', verify: 'Verificar este id ↗',
      tagline: 'Laboratorio de paper trading y análisis técnico', title: 'Certificado de finalización', certifies: 'Se certifica que',
      has: 'completó los {n} módulos y aprobó todos los cuestionarios de', hasNoCount: 'completó todos los módulos y aprobó todos los cuestionarios de',
      defaultCourse: 'Curso Broward Trading', date: 'Fecha de finalización', id: 'Id del certificado', verified: 'verificado', selfIssued: 'autoemitido',
      signature: 'Autor del curso · Broward Trading', seal: 'APRENDE · OPERA', student: 'Estudiante',
      disclaimerVerified: 'Broward Trading es un simulador educativo gratuito. Este certificado reconoce la finalización de un curso en línea; no es una licencia profesional, una titulación ni asesoría financiera.',
      disclaimerSelf: 'Broward Trading es un simulador educativo gratuito. Este certificado autoemitido reconoce la finalización de un curso en línea; no es una licencia profesional, una titulación ni asesoría financiera.',
      helpVerified: 'Este id está guardado en el servidor de Broward Trading; cualquiera puede comprobarlo en {url}.',
      helpSelf: 'Este id se emitió dentro de tu navegador a partir del progreso guardado en este dispositivo; la página Verificar lo reconoce solo aquí. Inicia sesión en la página Pro (cuando esté disponible) y vuelve a emitirlo para obtener un id verificado por el servidor.',
      helpParams: 'Se muestran los datos de la dirección de esta página. Aquí no se comprueba nada: usa la página Verificar para confirmar un id.',
      helpTip: 'Consejo: en el diálogo de impresión elige “Guardar como PDF”, orientación horizontal y sin encabezados ni pies de página.',
      emptyTitle: 'Todavía no hay un certificado en este dispositivo',
      emptyBody: 'Los certificados se emiten desde la página del curso cuando todas las lecciones están hechas y el promedio de cuestionarios de cada módulo es 80% o más. El registro emitido se guarda en este navegador y aparece aquí automáticamente.',
      emptyGo: 'Ver tu progreso y los requisitos', or: '¿Ya tienes un certificado? Escribe sus datos para imprimirlo:',
      fName: 'Nombre en el certificado', fId: 'Id del certificado', fDate: 'Fecha (AAAA-MM-DD)', fShow: 'Mostrar certificado', preview: 'VISTA PREVIA',
      langAria: 'Idioma del certificado'
    }
  };
  var LOCALE = { en: 'en-US', es: 'es-419' };
  var lang = 'en';
  function t(k, v) { var s = (STR[lang] && STR[lang][k]) || STR.en[k] || k; return v ? s.replace(/\{(\w+)\}/g, function (m, kk) { return v[kk] == null ? m : String(v[kk]); }) : s; }

  function params() { try { return new URLSearchParams(location.search); } catch (e) { return { get: function () { return null; } }; } }
  function pickLang() {
    var q = String(params().get('lang') || '').toLowerCase();
    if (STR[q]) return q;
    try { var l = BT.i18n && BT.i18n.lang && BT.i18n.lang(); if (STR[l]) return l; } catch (e) { /* ignore */ }
    try { var stored = JSON.parse(localStorage.getItem('bt.lang')); if (STR[stored]) return stored; } catch (e) { /* ignore */ }
    return 'en';
  }
  function cleanId(id) { return String(id == null ? '' : id).toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 24); }
  function cleanName(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80); }
  function parseDate(v) {
    if (!v) return null;
    var d = /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? new Date(String(v) + 'T12:00:00') : new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtDate(d) {
    try { return new Intl.DateTimeFormat(LOCALE[lang] || 'en-US', { year: 'numeric', month: 'long', day: 'numeric' }).format(d); }
    catch (e) { return d.toISOString().slice(0, 10); }
  }
  function verifyUrl(id) {
    try { return new URL('verify.html?id=' + encodeURIComponent(id), location.href.split('#')[0]).href; } catch (e) { return 'verify.html?id=' + encodeURIComponent(id); }
  }
  /** The certificate to show: query params win (a shareable link), else the saved record. */
  function record() {
    var p = params(), name = cleanName(p.get('name')), id = cleanId(p.get('id'));
    if (name || id) {
      return { name: name || t('student'), id: id || '', date: parseDate(p.get('date')) || new Date(), verified: /^BT-\d{4}-(?!L)[A-Z0-9]{6}$/.test(id) && p.get('verified') === '1', fromParams: true, course: cleanName(p.get('course')) };
    }
    var rec = null;
    try { rec = C && C.certificateRecord ? C.certificateRecord() : null; } catch (e) { rec = null; }
    if (!rec) { try { var raw = JSON.parse(localStorage.getItem('bt.course')); rec = raw && raw.certificate && raw.certificate.id ? raw.certificate : null; } catch (e) { rec = null; } }
    if (!rec) return null;
    return { name: cleanName(rec.name) || t('student'), id: cleanId(rec.id), date: parseDate(rec.date) || new Date(), verified: !!rec.verified, verifyUrl: rec.verifyUrl || null, fromParams: false };
  }

  /* decorative candlestick strip, deterministic from the name (same idea as the PNG certificate) */
  function candlesSvg(name) {
    var seed = 0; for (var i = 0; i < name.length; i++) seed = (seed * 31 + name.charCodeAt(i)) >>> 0;
    var rnd = function () { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    var W = 1000, H = 120, n = 46, gap = W / n, p = 60, out = '';
    for (i = 0; i < n; i++) {
      var o = p, c = o + (rnd() - 0.47) * 22, hi = Math.max(o, c) + rnd() * 9, lo = Math.min(o, c) - rnd() * 9; p = Math.max(15, Math.min(105, c));
      var x = i * gap + gap / 2, col = c >= o ? '#16a34a' : '#dc2626';
      out += '<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (H - hi).toFixed(1) + '" y2="' + (H - lo).toFixed(1) + '" stroke="' + col + '" stroke-width="1.5"/>' +
        '<rect x="' + (x - gap * 0.3).toFixed(1) + '" y="' + (H - Math.max(o, c)).toFixed(1) + '" width="' + (gap * 0.6).toFixed(1) + '" height="' + Math.max(2, Math.abs(c - o)).toFixed(1) + '" fill="' + col + '"/>';
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + out + '</svg>';
  }
  var MARK = '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="10" fill="#2563eb"/><path d="M12 32l8-10 6 6 10-14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="10" width="6" height="6" rx="1" fill="#fff" opacity=".9"/></svg>';

  var modules = null;   // [{title}] from course/index.json once loaded
  var courseTitle = '';

  function render() {
    var rec = record();
    var sheet = $('sheet'), help = $('help'), vlink = $('verifyLink'), printBtn = $('printBtn');
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('.cert-tools .lang button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
    var lg = document.querySelector('.cert-tools .lang'); if (lg) lg.setAttribute('aria-label', t('langAria'));
    document.title = t('pageTitle') + ' · Broward Trading';

    if (!rec) {
      sheet.innerHTML = '<section class="card cert-empty"><h2>' + esc(t('emptyTitle')) + '</h2><p>' + esc(t('emptyBody')) + '</p>' +
        '<a class="btn primary" href="learn.html#/certificate" style="display:inline-flex;min-height:44px;align-items:center">' + esc(t('emptyGo')) + '</a>' +
        '<p style="margin-top:14px">' + esc(t('or')) + '</p>' +
        '<form class="cert-form" id="manual" novalidate>' +
        '<label>' + esc(t('fName')) + '<input name="name" maxlength="80" autocomplete="name" required></label>' +
        '<label>' + esc(t('fId')) + '<input name="id" maxlength="24" autocapitalize="characters" spellcheck="false" placeholder="BT-2026-ABC234"></label>' +
        '<label>' + esc(t('fDate')) + '<input name="date" type="date"></label>' +
        '<button type="submit" class="primary">' + esc(t('fShow')) + '</button></form></section>';
      help.textContent = '';
      vlink.hidden = true; printBtn.hidden = true;
      $('manual').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target, q = new URLSearchParams();
        var nm = cleanName(f.name.value); if (!nm) { f.name.focus(); return; }
        q.set('name', nm); if (cleanId(f.id.value)) q.set('id', cleanId(f.id.value)); if (f.date.value) q.set('date', f.date.value); q.set('lang', lang);
        try { history.pushState(null, '', location.pathname + '?' + q.toString()); } catch (err) { location.search = '?' + q.toString(); return; }
        render();
      });
      return;
    }

    var id = rec.id, verified = !!rec.verified && !/^BT-LOCAL-/.test(id) && !/^BT-\d{4}-L/.test(id);
    var vurl = id ? (rec.verifyUrl || verifyUrl(id)) : '';
    var title = rec.course || courseTitle || t('defaultCourse');
    var nameCls = rec.name.length > 34 ? ' longer' : rec.name.length > 22 ? ' long' : '';
    var modLine = modules && modules.length ? modules.map(function (m) { return esc(m.title); }).join(' · ') : '';
    var countText = modules && modules.length ? t('has', { n: modules.length }) : t('hasNoCount');
    sheet.innerHTML = '<article class="cert-sheet' + (rec.fromParams ? ' from-params' : '') + '" role="img" aria-label="' + esc(t('title') + ': ' + rec.name) + '">' +
      '<div class="candles">' + candlesSvg(rec.name) + '</div>' +
      '<div><div class="brand">' + MARK + '<div><b class="no-i18n" translate="no">Broward Trading</b><small>' + esc(t('tagline')) + '</small></div></div>' +
      '<div class="title">' + esc(t('title')) + '</div>' +
      '<p class="certifies">' + esc(t('certifies')) + '</p>' +
      '<div class="name' + nameCls + '">' + esc(rec.name) + '</div><div class="rule"></div>' +
      '<p class="has">' + esc(countText) + '</p>' +
      '<div class="course">' + esc(title) + '</div>' +
      (modLine ? '<p class="modules">' + modLine + '</p>' : '') + '</div>' +
      '<div><div class="foot">' +
      '<div><span class="sig"><div class="v">' + esc(fmtDate(rec.date)) + '</div><span class="k">' + esc(t('date')) + '</span></span><br><span class="sig" style="margin-top:1.2em"><div class="v">&nbsp;</div><span class="k">' + esc(t('signature')) + '</span></span></div>' +
      '<div class="seal" aria-hidden="true"><div><b>BT</b><small>' + esc(t('seal')) + '</small></div></div>' +
      '<div class="id">' + (id ? '<div class="v">' + esc(id) + '<span class="status' + (verified ? ' verified' : '') + '">' + esc(verified ? t('verified') : t('selfIssued')) + '</span></div><span class="k">' + esc(t('id')) + '</span>' + (vurl ? '<span class="verify">' + esc(vurl) + '</span>' : '') : '<span class="k">' + esc(t('id')) + ': —</span>') + '</div>' +
      '</div><p class="disclaimer">' + esc(verified ? t('disclaimerVerified') : t('disclaimerSelf')) + '</p></div>' +
      (rec.fromParams && !id ? '<div class="watermark" aria-hidden="true">' + esc(t('preview')) + '</div>' : '') +
      '</article>';
    help.textContent = (rec.fromParams ? t('helpParams') : verified ? t('helpVerified', { url: vurl }) : t('helpSelf')) + ' ' + t('helpTip');
    if (id) { vlink.hidden = false; vlink.href = 'verify.html?id=' + encodeURIComponent(id); } else vlink.hidden = true;
    printBtn.hidden = !canPrint();
  }
  function canPrint() {
    if (typeof window.print !== 'function') return false;
    try { return window.top === window.self; } catch (e) { return false; }
  }

  lang = pickLang();
  $('printBtn').addEventListener('click', function () { try { window.print(); } catch (e) { /* ignore */ } });
  document.querySelectorAll('.cert-tools .lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { var q = new URLSearchParams(location.search); q.set('lang', lang); history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (e) { /* ignore */ }
      render();
    });
  });
  // the site-wide EN/ES toggle in the nav switches the sheet too (when no ?lang= pins it)
  window.addEventListener('bt:lang', function (e) { if (params().get('lang')) return; var l = e && e.detail && e.detail.lang; if (STR[l]) { lang = l; render(); } });
  window.addEventListener('bt:langchange', function (e) { if (params().get('lang')) return; var l = e && e.detail && e.detail.lang; if (STR[l]) { lang = l; render(); } });
  window.addEventListener('popstate', render);
  render();

  // course title and module list from course/index.json (language-aware via BT.course); the sheet is fine without them
  if (C && typeof C.loadIndex === 'function') {
    try { if (C.setLang) C.setLang(lang); } catch (e) { /* ignore */ }
    C.loadIndex().then(function (idx) {
      if (!idx) return;
      courseTitle = idx.title || '';
      modules = (idx.modules || []).map(function (m) { return { title: m.title }; });
      render();
    }).catch(function () { /* keep the default title */ });
  }
})();
</script>
</body>
</html>
